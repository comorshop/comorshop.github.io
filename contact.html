<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comorshop - Contact</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
        }

        /* En-tête avec le logo */
        header {
            background-color: #1a365d;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .site-logo {
            max-width: 120px;
            height: auto;
            margin-bottom: 10px;
        }

        /* Menu de navigation */
        nav {
            background-color: #2b6cb0;
            text-align: center;
            padding: 12px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            color: #25D366;
        }

        /* Contenu principal */
        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1a365d;
        }

        /* Formulaire */
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }

        /* Bouton d'envoi */
        .btn-submit {
            width: 100%;
            background-color: #25D366;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-submit:hover {
            background-color: #1eb854;
        }

        /* Pied de page */
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 0.9em;
            background-color: #e9ecef;
            margin-top: 40px;
        }
        footer a {
            color: #333;
            text-decoration: none;
            margin: 0 10px;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Logo Comorshop" class="site-logo">
        <h1>Comorshop</h1>
        <p>Demande de devis & Renseignements</p>
    </header>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="propos.html">À propos</a>
        <a href="contact.html">Contact</a>
        <a href="mentions-legales.html">Mentions Légales</a>
        <a href="cgv.html">CGV</a>
    </nav>

    <main>
        <h2>Contactez-nous</h2>
        <p style="text-align: center; color: #666;">Remplissez ce formulaire pour recevoir une estimation ou un devis personnalisé.</p>

        <!-- Formulaire relié à Formspree -->
        <form action="https://formspree.io/f/https://formspree.io/f/xwvgaazp" method="POST">
            <div class="form-group">
                <label for="nom">Nom complet</label>
                <input type="text" id="nom" name="nom" required placeholder="Votre nom et prénom">
            </div>

            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" required placeholder="votre.email@exemple.com">
            </div>

            <div class="form-group">
                <label for="telephone">Téléphone</label>
                <input type="tel" id="telephone" name="telephone" placeholder="Votre numéro de téléphone">
            </div>

            <div class="form-group">
                <label for="categorie">Catégorie concernée</label>
                <select id="categorie" name="categorie" required>
                    <option value="" disabled selected>Choisissez une catégorie...</option>
                    <option value="meubles">🛋️ Meubles</option>
                    <option value="electromenager">🔌 Électroménager</option>
                    <option value="textile">🧵 Textile</option>
                    <option value="carrelage">🧱 Carrelage</option>
                    <option value="autre">📦 Autre demande</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Détails de votre projet ou demande</label>
                <textarea id="message" name="message" required placeholder="Précisez la quantité, les dimensions, les matériaux ou toute autre information utile..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Envoyer la demande</button>
        </form>
    </main>

    <footer>
        &copy; 2026 Comorshop - Tous droits réservés. | 
        <a href="mentions-legales.html">Mentions Légales</a> | 
        <a href="cgv.html">CGV</a>
    </footer>

</body>
</html>
